<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="720" viewBox="0 0 1200 720"
     role="img" aria-labelledby="title desc">
  <title id="title">Y'1 演进：单一发送键 + 浮层选择</title>
  <desc id="desc">发送键保持一个，内嵌小箭头展开浮层选择 Steer/Queue，空输入时整体灰禁，打断窄键独立。</desc>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <g id="header" font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="44" font-size="23" font-weight="bold" fill="#212121">Y'₁ 演进 · 单一发送键 + 浮层选择（Split + Popover）</text>
    <text x="40" y="74" font-size="14.5" fill="#616161">主键 = 当前投递方式（默认 Queue）；▾ 展开浮层切换并记忆；浮层不占布局 → 零跳变</text>
  </g>

  <!-- ===== 规则卡 ===== -->
  <g id="rules" font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="40" y="100" width="560" height="64" rx="8" fill="#f5f5f5" stroke="#e53935" stroke-width="1.5"/>
    <text x="60" y="126" font-size="15" font-weight="bold" fill="#e53935">空输入 → 发送组（主键+▾）整体灰禁 + [⏹ 打断]</text>
    <text x="60" y="149" font-size="13" fill="#616161">无内容无需选择投递方式 · 灰禁 = 惯例占位，宽度不变</text>

    <rect x="620" y="100" width="540" height="64" rx="8" fill="#f5f5f5" stroke="#1565c0" stroke-width="1.5"/>
    <text x="640" y="126" font-size="15" font-weight="bold" fill="#1565c0">有输入 → 主键发送（当前方式）+ ▾ 浮层选择 Steer/Queue</text>
    <text x="640" y="149" font-size="13" fill="#616161">点主键 = 立即发送 · 点 ▾ = 浮层切换，选择记忆为默认</text>
  </g>

  <!-- ===== 状态 A：空输入 ===== -->
  <g id="state-empty" font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="210" font-size="14.5" fill="#616161">空输入（常态）</text>
    <rect x="60" y="220" width="760" height="114" rx="10" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
    <rect x="80" y="234" width="720" height="52" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
    <text x="96" y="265" font-size="13.5" fill="#9e9e9e">输入指示内容…</text>
    <rect x="80" y="292" width="720" height="38" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="92" y="300" width="88" height="22" rx="11" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
    <text x="136" y="315" font-size="11.5" text-anchor="middle" fill="#424242">模型 ▾</text>
    <rect x="560" y="300" width="60" height="22" rx="11" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
    <text x="590" y="315" font-size="11.5" text-anchor="middle" fill="#424242">思考</text>

    <!-- 打断窄键 -->
    <rect x="706" y="296" width="34" height="32" rx="6" fill="#ffffff" stroke="#e53935" stroke-width="1.5"/>
    <rect x="719" y="308" width="8" height="8" fill="#e53935"/>
    <!-- 发送主键（灰禁） -->
    <rect x="748" y="296" width="34" height="32" rx="6" fill="#eeeeee" stroke="#bdbdbd" stroke-width="1"/>
    <path d="M 765 302 L 765 314 M 759 308 L 765 302 L 771 308" stroke="#9e9e9e" stroke-width="2" fill="none"/>
    <!-- ▾ 键（灰禁） -->
    <rect x="782" y="296" width="22" height="32" rx="6" fill="#eeeeee" stroke="#bdbdbd" stroke-width="1"/>
    <path d="M 787 304 L 793 312 L 799 304" stroke="#9e9e9e" stroke-width="2" fill="none"/>

    <text x="880" y="236" font-size="14.5" fill="#424242">· 主键 + ▾ 整体灰禁</text>
    <text x="880" y="262" font-size="14.5" fill="#424242">· 发送组宽 56px 恒定</text>
    <text x="880" y="288" font-size="14.5" fill="#424242">· 打断窄键独立可点</text>
  </g>

  <!-- ===== 状态 B：有输入 + 浮层展开 ===== -->
  <g id="state-input" font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="380" font-size="14.5" fill="#616161">有输入 · ▾ 已展开（浮层）</text>
    <rect x="60" y="390" width="760" height="114" rx="10" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
    <rect x="80" y="404" width="720" height="52" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
    <text x="96" y="435" font-size="13.5" fill="#212121">修复一下 login 的错误处理</text>
    <rect x="80" y="462" width="720" height="38" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="92" y="470" width="88" height="22" rx="11" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
    <text x="136" y="485" font-size="11.5" text-anchor="middle" fill="#424242">模型 ▾</text>
    <rect x="560" y="470" width="60" height="22" rx="11" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
    <text x="590" y="485" font-size="11.5" text-anchor="middle" fill="#424242">思考</text>

    <!-- 打断窄键 -->
    <rect x="706" y="466" width="34" height="32" rx="6" fill="#ffffff" stroke="#e53935" stroke-width="1.5"/>
    <rect x="719" y="478" width="8" height="8" fill="#e53935"/>
    <!-- 发送主键（可用） -->
    <rect x="748" y="466" width="34" height="32" rx="6" fill="#1565c0"/>
    <path d="M 765 472 L 765 484 M 759 478 L 765 472 L 771 478" stroke="#ffffff" stroke-width="2" fill="none"/>
    <!-- ▾ 键（可用，展开态） -->
    <rect x="782" y="466" width="22" height="32" rx="6" fill="#0d47a1"/>
    <path d="M 787 474 L 793 482 L 799 474" stroke="#ffffff" stroke-width="2" fill="none"/>

    <!-- 浮层菜单：从 ▾ 上方弹出，覆盖输入区右段，不占布局 -->
    <rect x="726" y="412" width="164" height="90" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="746" y="440" font-size="13.5" fill="#212121">⚡ Steer</text>
    <line x1="742" y1="454" x2="874" y2="454" stroke="#e0e0e0" stroke-width="1"/>
    <text x="746" y="484" font-size="13.5" font-weight="bold" fill="#1565c0">⏳ Queue</text>
    <text x="868" y="484" font-size="12.5" fill="#1565c0">✓ 当前</text>
    <!-- 指向箭头 -->
    <path d="M 787 506 L 793 514 L 799 506" fill="none" stroke="#1565c0" stroke-width="1.5"/>

    <text x="880" y="410" font-size="14.5" fill="#424242">· 点主键 = 以当前方式发送</text>
    <text x="880" y="436" font-size="14.5" fill="#424242">· 点 ▾ = 浮层选 Steer/Queue</text>
    <text x="880" y="462" font-size="14.5" fill="#424242">· 选择记忆，主键 tooltip 提示</text>
    <text x="880" y="488" font-size="14.5" fill="#424242">· 浮层覆盖输入区，不占布局</text>
    <text x="880" y="514" font-size="14.5" fill="#424242">· Ctrl+Enter = 当前默认方式</text>
  </g>

  <!-- ===== 底部总结 ===== -->
  <g id="summary" font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <line x1="40" y1="660" x2="1160" y2="660" stroke="#e0e0e0" stroke-width="1.5"/>
    <text x="40" y="688" font-size="14.5" fill="#212121">
      <tspan font-weight="bold">组合形态：</tspan>
      单一发送键（Split，宽 56px 恒定）+ 浮层选择 + 打断窄键 ——
      空输入灰禁自然占位；有输入浮层切换方式并记忆；布局零跳变、无空槽、无长按钮。
    </text>
  </g>
</svg>
