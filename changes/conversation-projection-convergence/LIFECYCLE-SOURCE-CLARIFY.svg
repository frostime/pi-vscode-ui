<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1580" viewBox="0 0 1680 1580" role="img" aria-labelledby="title desc">
  <title id="title">一个边界场景：重新加载后为什么可能无法判断执行起因</title>
  <desc id="desc">用朴素白板解释 Pi 核心自动重试与 Pi 扩展独立触发执行的区别。后者不是 retry，也不是本次故障路径；它只用于说明会话记录缺少来源信息时 FrostPi 的责任边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <style>
      .title { font: 700 31px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #17212b; }
      .subtitle { font: 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #526170; }
      .section { font: 700 20px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #17212b; }
      .heading { font: 700 17px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #22313f; }
      .body { font: 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #2c3c4b; }
      .small { font: 13px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #526170; }
      .strong { font: 700 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #17212b; }
      .red { font: 700 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #a5251b; }
      .green { font: 700 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #176b51; }
      .blue { font: 700 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #245c91; }
      .panel { fill: #ffffff; stroke: #a6b0ba; stroke-width: 1.5; }
      .term { fill: #f8fafc; stroke: #b8c2cc; stroke-width: 1.3; }
      .user { fill: #edf5ff; stroke: #5a91c4; stroke-width: 1.6; }
      .error { fill: #fff0ee; stroke: #c95b50; stroke-width: 1.6; }
      .success { fill: #ecf8f2; stroke: #4a9c7d; stroke-width: 1.6; }
      .signal { fill: #fff8df; stroke: #bd8a22; stroke-width: 1.6; }
      .missing { fill: #fff5f3; stroke: #b42318; stroke-width: 2; stroke-dasharray: 7 5; }
      .choice { fill: #ffffff; stroke: #8996a3; stroke-width: 1.5; }
      .recommended { fill: #eef8f3; stroke: #35866a; stroke-width: 2.3; }
      .flow { stroke: #3e4c59; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow-red { stroke: #b42318; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .dashed { stroke: #8b98a5; stroke-width: 1.6; fill: none; stroke-dasharray: 6 6; }
      .divider { stroke: #d7dee5; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1680" height="1580" fill="#fcfcfb"/>
  <text x="52" y="54" class="title">一个边界场景：重新加载后为什么可能无法判断执行起因？</text>
  <text x="52" y="84" class="subtitle">情况 B 不是 retry，也不是本次故障路径；它只解释 FrostPi 为什么不承诺还原所有第三方执行起因。</text>

  <g id="terms">
    <text x="52" y="130" class="section">一、这张图只使用六个概念</text>

    <rect x="52" y="154" width="250" height="88" rx="6" class="term"/>
    <text x="70" y="182" class="heading">用户回合</text>
    <text x="70" y="207" class="small">一次用户请求及其后续工作，</text>
    <text x="70" y="226" class="small">在 FrostPi 中显示为一个整体。</text>

    <rect x="318" y="154" width="250" height="88" rx="6" class="term"/>
    <text x="336" y="182" class="heading">执行尝试</text>
    <text x="336" y="207" class="small">Pi 向模型请求一次结果。</text>
    <text x="336" y="226" class="small">自动重试会产生新的执行尝试。</text>

    <rect x="584" y="154" width="250" height="88" rx="6" class="term"/>
    <text x="602" y="182" class="heading">会话记录</text>
    <text x="602" y="207" class="small">Pi 写入磁盘的消息记录。</text>
    <text x="602" y="226" class="small">重新加载时主要读取这里。</text>

    <rect x="850" y="154" width="250" height="88" rx="6" class="term"/>
    <text x="868" y="182" class="heading">实时信号</text>
    <text x="868" y="207" class="small">运行过程中发出的状态通知，</text>
    <text x="868" y="226" class="small">例如“接下来会自动重试”。</text>

    <rect x="1116" y="154" width="250" height="88" rx="6" class="term"/>
    <text x="1134" y="182" class="heading">自动继续</text>
    <text x="1134" y="207" class="small">重试或自动压缩后，Pi 在没有</text>
    <text x="1134" y="226" class="small">新用户请求时继续执行。</text>

    <rect x="1382" y="154" width="246" height="88" rx="6" class="term"/>
    <text x="1400" y="182" class="heading">来源信息</text>
    <text x="1400" y="207" class="small">说明“这次再次执行为什么开始”</text>
    <text x="1400" y="226" class="small">的持久化标记。</text>
  </g>

  <line x1="52" y1="274" x2="1628" y2="274" class="divider"/>
  <text x="52" y="316" class="section">二、运行时：两种过程明显不同</text>

  <g id="normal-retry">
    <rect x="52" y="344" width="764" height="336" rx="7" class="panel"/>
    <text x="76" y="378" class="heading">情况 A：Pi 正常自动重试</text>
    <text x="76" y="402" class="small">这是本次故障对应的正常路径。</text>

    <rect x="76" y="438" width="150" height="66" rx="5" class="user"/>
    <text x="95" y="466" class="strong">用户发出请求</text>
    <text x="95" y="486" class="small">一个用户回合开始</text>

    <path d="M226 471 L270 471" class="flow"/>
    <rect x="272" y="438" width="150" height="66" rx="5" class="error"/>
    <text x="291" y="466" class="red">第一次执行失败</text>
    <text x="291" y="486" class="small">错误被记录</text>

    <path d="M422 471 L466 471" class="flow"/>
    <rect x="468" y="426" width="154" height="90" rx="5" class="signal"/>
    <text x="487" y="456" class="strong">Pi 明确通知</text>
    <text x="487" y="479" class="blue">“接下来自动重试”</text>
    <text x="487" y="500" class="small">这是实时信号</text>

    <path d="M622 471 L666 471" class="flow"/>
    <rect x="668" y="438" width="124" height="66" rx="5" class="success"/>
    <text x="687" y="466" class="green">第二次成功</text>
    <text x="687" y="486" class="small">最终回复</text>

    <text x="76" y="555" class="heading">Pi 写入磁盘：</text>
    <rect x="76" y="576" width="176" height="55" rx="5" class="user"/>
    <text x="95" y="610" class="body">用户请求</text>
    <path d="M252 603 L292 603" class="flow"/>
    <rect x="294" y="576" width="176" height="55" rx="5" class="error"/>
    <text x="313" y="610" class="body">失败回复</text>
    <path d="M470 603 L510 603" class="flow"/>
    <rect x="512" y="576" width="176" height="55" rx="5" class="success"/>
    <text x="531" y="610" class="body">成功回复</text>

    <path d="M545 516 L545 553" class="dashed"/>
    <text x="566" y="547" class="red">“将自动重试”没有写入磁盘</text>
  </g>

  <g id="extension-run">
    <rect x="840" y="344" width="788" height="336" rx="7" class="panel"/>
    <text x="864" y="378" class="heading">情况 B：Pi 扩展启动一次独立执行（不是 retry）</text>
    <text x="864" y="402" class="small">这里指 Pi extension，不是 FrostPi；只有扩展不新增用户消息时才会模糊。</text>

    <rect x="864" y="438" width="150" height="66" rx="5" class="user"/>
    <text x="883" y="466" class="strong">用户发出请求</text>
    <text x="883" y="486" class="small">一个用户回合开始</text>

    <path d="M1014 471 L1054 471" class="flow"/>
    <rect x="1056" y="438" width="150" height="66" rx="5" class="error"/>
    <text x="1075" y="466" class="red">第一次执行失败</text>
    <text x="1075" y="486" class="small">这次已经结束</text>

    <path d="M1206 471 L1246 471" class="flow"/>
    <rect x="1248" y="426" width="190" height="90" rx="5" class="signal"/>
    <text x="1267" y="454" class="strong">Pi 扩展调用接口</text>
    <text x="1267" y="477" class="blue">启动独立模型执行</text>
    <text x="1267" y="500" class="small">但没有新增用户消息</text>

    <path d="M1438 471 L1478 471" class="flow"/>
    <rect x="1480" y="438" width="124" height="66" rx="5" class="success"/>
    <text x="1499" y="466" class="green">独立回复</text>
    <text x="1499" y="486" class="small">不是 retry 结果</text>

    <text x="864" y="555" class="heading">Pi 可能写入磁盘：</text>
    <rect x="864" y="576" width="176" height="55" rx="5" class="user"/>
    <text x="883" y="610" class="body">用户请求</text>
    <path d="M1040 603 L1080 603" class="flow"/>
    <rect x="1082" y="576" width="176" height="55" rx="5" class="error"/>
    <text x="1101" y="610" class="body">失败回复</text>
    <path d="M1258 603 L1298 603" class="flow"/>
    <rect x="1300" y="576" width="176" height="55" rx="5" class="success"/>
    <text x="1319" y="610" class="body">新的回复</text>

    <path d="M1343 516 L1343 553" class="dashed"/>
    <text x="1364" y="547" class="red">独立执行的来源可能没有写入磁盘</text>
  </g>

  <line x1="52" y1="716" x2="1628" y2="716" class="divider"/>
  <text x="52" y="758" class="section">三、重新加载：FrostPi 只能看到同样的三条记录</text>

  <g id="reload-ambiguity">
    <rect x="170" y="798" width="220" height="66" rx="5" class="user"/>
    <text x="195" y="827" class="strong">用户请求</text>
    <text x="195" y="848" class="small">磁盘记录 1</text>
    <path d="M390 831 L470 831" class="flow"/>
    <rect x="472" y="798" width="220" height="66" rx="5" class="error"/>
    <text x="497" y="827" class="red">失败回复</text>
    <text x="497" y="848" class="small">磁盘记录 2</text>
    <path d="M692 831 L772 831" class="flow"/>
    <rect x="774" y="798" width="220" height="66" rx="5" class="success"/>
    <text x="799" y="827" class="green">后续回复</text>
    <text x="799" y="848" class="small">磁盘记录 3</text>
    <path d="M994 831 L1074 831" class="flow-red"/>
    <rect x="1076" y="780" width="434" height="102" rx="6" class="missing"/>
    <text x="1100" y="812" class="red">缺失的问题答案</text>
    <text x="1100" y="839" class="body">记录 3 是 Pi 核心自动重试的结果，</text>
    <text x="1100" y="861" class="body">还是 Pi 扩展开始的独立执行？</text>

    <text x="170" y="914" class="strong">仅凭这三条磁盘记录，答案无法被证明。</text>
    <text x="170" y="941" class="body">内部代码可以把它猜成某一种，但更换代码结构不会补回没有保存的来源信息。</text>
  </g>

  <line x1="52" y1="982" x2="1628" y2="982" class="divider"/>
  <text x="52" y="1024" class="section">四、已确认的责任范围，以及没有采用的高成本方案</text>

  <g id="choices">
    <rect x="52" y="1054" width="494" height="396" rx="7" class="recommended"/>
    <text x="76" y="1088" class="heading">选择 1：保证 Pi 核心的正常流程</text>
    <text x="76" y="1115" class="green">已确认采用</text>
    <line x1="76" y1="1132" x2="522" y2="1132" class="divider"/>
    <text x="76" y="1163" class="strong">怎么判断</text>
    <text x="76" y="1188" class="body">把 Pi 正常产生的“失败 → 后续回复”</text>
    <text x="76" y="1211" class="body">视为同一个用户回合中的自动继续。</text>
    <text x="76" y="1251" class="strong">能够保证</text>
    <text x="76" y="1276" class="body">正常自动重试、自动压缩后的继续、</text>
    <text x="76" y="1299" class="body">重新加载前后都保持一个用户回合。</text>
    <text x="76" y="1339" class="strong">边界</text>
    <text x="76" y="1364" class="body">不留下来源信息的 Pi 扩展独立执行，</text>
    <text x="76" y="1387" class="body">不承诺还原起因；消息仍不能丢失或重复。</text>
    <text x="76" y="1427" class="small">调整范围：FrostPi 会话投影；成本中等。</text>

    <rect x="593" y="1054" width="494" height="396" rx="7" class="choice"/>
    <text x="617" y="1088" class="heading">选择 2：让 Pi 保存来源信息</text>
    <text x="617" y="1115" class="blue">未采用：需要上游配合</text>
    <line x1="617" y1="1132" x2="1063" y2="1132" class="divider"/>
    <text x="617" y="1163" class="strong">怎么做</text>
    <text x="617" y="1188" class="body">每次再次执行时，Pi 在磁盘中保存：</text>
    <text x="617" y="1211" class="body">自动重试、压缩后继续、扩展触发等来源。</text>
    <text x="617" y="1251" class="strong">能够保证</text>
    <text x="617" y="1276" class="body">重新加载后仍能准确区分两种过程，</text>
    <text x="617" y="1299" class="body">不需要 FrostPi 根据消息形状判断。</text>
    <text x="617" y="1339" class="strong">代价</text>
    <text x="617" y="1364" class="body">修改 Pi 的会话格式和接口，处理旧版本</text>
    <text x="617" y="1387" class="body">兼容；FrostPi 不能单独完成。</text>
    <text x="617" y="1427" class="small">调整范围：Pi + FrostPi；成本高。</text>

    <rect x="1134" y="1054" width="494" height="396" rx="7" class="choice"/>
    <text x="1158" y="1088" class="heading">选择 3：FrostPi 另存一份关系表</text>
    <text x="1158" y="1115" class="red">未采用：不建议</text>
    <line x1="1158" y1="1132" x2="1604" y2="1132" class="divider"/>
    <text x="1158" y="1163" class="strong">怎么做</text>
    <text x="1158" y="1188" class="body">FrostPi 在 Pi 会话文件之外，额外保存</text>
    <text x="1158" y="1211" class="body">“哪条回复属于哪个用户回合”。</text>
    <text x="1158" y="1251" class="strong">能够保证</text>
    <text x="1158" y="1276" class="body">在额外关系表始终同步的前提下，</text>
    <text x="1158" y="1299" class="body">重新加载时可以恢复来源。</text>
    <text x="1158" y="1339" class="strong">代价与风险</text>
    <text x="1158" y="1364" class="body">分支、复制、外部修改、文件丢失都需要</text>
    <text x="1158" y="1387" class="body">同步和修复；形成第二套历史事实。</text>
    <text x="1158" y="1427" class="small">调整范围：新增持久化机制；成本很高。</text>
  </g>

  <rect x="52" y="1484" width="1576" height="56" rx="6" fill="#f4f6f8" stroke="#c4ccd4"/>
  <text x="76" y="1518" class="strong">已确认边界：</text>
  <text x="190" y="1518" class="body">FrostPi 保证 Pi 核心对话正确；纯通知状态不持久化；不解释缺失来源信息的任意 Pi 扩展执行。</text>
</svg>
