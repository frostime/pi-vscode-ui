name: Desktop release

# Test Desktop locally before tagging. Hosted release only builds/packages/uploads;
# GUI automation on the runner must not block publication. Independent of release.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    name: Package Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs check ($env:GITHUB_REF_NAME.Substring(1))
      - name: Select Windows MSVC Rust toolchain
        run: rustup default stable-x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Package portable ZIP
        run: pnpm package:desktop
      - name: Package signed MSI
        env:
          FROSTPI_UPDATE_PUBLIC_KEY: ${{ vars.FROSTPI_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm package:desktop:msi
      - name: Check archive integrity and bind release assets to this commit
        if: startsWith(github.ref, 'refs/tags/v')
        run: node apps/desktop/scripts/prepare-release.mjs "$env:GITHUB_REF_NAME"
      - name: Check MSI release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: node apps/desktop/scripts/prepare-msi-release.mjs "$env:GITHUB_REF_NAME"
      - name: Preserve Desktop packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FrostPi-Desktop-Windows-x64-candidate
          path: |
            artifacts/FrostPi-*-win32-x64.zip
            artifacts/FrostPi-*-win32-x64.zip.sha256
            artifacts/FrostPi-*-win32-x64.msi
            artifacts/FrostPi-*-win32-x64.msi.sig
            artifacts/FrostPi-desktop-update.json
          if-no-files-found: warn

  publish:
    name: Upload Desktop to GitHub Release
    needs: windows-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download this run's Desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name FrostPi-Desktop-Windows-x64-candidate --dir artifacts
      - name: Recheck transferred ZIP checksum
        working-directory: artifacts
        run: |
          sha256sum --check FrostPi-*-win32-x64.zip.sha256
      - name: Create release if needed, then attach Desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=()
            if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
          # Upload the manifest last, after the signed MSI is available.
          for asset in \
            artifacts/FrostPi-*-win32-x64.zip \
            artifacts/FrostPi-*-win32-x64.zip.sha256 \
            artifacts/FrostPi-*-win32-x64.msi \
            artifacts/FrostPi-*-win32-x64.msi.sig \
            artifacts/FrostPi-desktop-update.json; do
            gh release upload "$TAG" "$asset"
          done
