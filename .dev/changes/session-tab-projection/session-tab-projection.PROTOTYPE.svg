<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <style>
      .bg{fill:#111318}.window{fill:#181a1f;stroke:#59606b;stroke-width:2}.bar{fill:#24272e}.activity{fill:#202329}.sidebar{fill:#1d2026}.editor{fill:#17191e}.tab{fill:#252932}.tabActive{fill:#17191e}.accent{fill:#3794ff}.green{fill:#3fb950}.mutedBox{fill:#23262d;stroke:#464c57;stroke-width:1}.card{fill:#20242b;stroke:#3d444d;stroke-width:1}.placeholder{fill:#1b1e24;stroke:#59606b;stroke-width:1.5;stroke-dasharray:7 5}.button{fill:#2c313a;stroke:#66707d;stroke-width:1}.rule{fill:#1d222a;stroke:#3d526a;stroke-width:1.5}.title{font:700 25px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#f0f3f6}.h2{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#f0f3f6}.text{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#d8dee9}.small{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#adb6c4}.tiny{font:11px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#8b949e}.label{font:700 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#79c0ff}.limited{font:700 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#ff7b72}.arrow{stroke:#58a6ff;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1040"/>
  <text x="42" y="48" class="title">FrostPi Session Tab · 设计层原型</text>
  <text x="42" y="76" class="small">评审范围：信息层级、展示位置与生命周期关系。颜色、尺寸、文案和具体控件排列均不是视觉定稿。</text>

  <!-- State 1 -->
  <text x="42" y="118" class="h2">1 · 默认：侧边栏完整承载当前 Session</text>
  <rect x="42" y="136" width="735" height="365" rx="8" class="window"/>
  <rect x="42" y="136" width="735" height="28" rx="8" class="bar"/>
  <circle cx="61" cy="150" r="4" fill="#ff5f56"/><circle cx="75" cy="150" r="4" fill="#ffbd2e"/><circle cx="89" cy="150" r="4" fill="#27c93f"/>
  <rect x="42" y="164" width="42" height="337" class="activity"/>
  <text x="56" y="198" class="text">◆</text><text x="56" y="232" class="small">F</text>
  <rect x="84" y="164" width="292" height="337" class="sidebar"/>
  <rect x="376" y="164" width="401" height="337" class="editor"/>
  <rect x="376" y="164" width="126" height="31" class="tabActive"/><text x="392" y="184" class="small">src/app.ts  ×</text>
  <text x="103" y="195" class="tiny">FROSTPI · SESSION 控制中心</text>
  <rect x="98" y="210" width="264" height="42" rx="5" class="mutedBox"/>
  <circle cx="115" cy="231" r="5" class="green"/><text x="128" y="228" class="text">Session A</text><text x="128" y="244" class="tiny">ready · ▼ Session 列表</text>
  <rect x="99" y="276" width="259" height="62" rx="5" class="card"/><text x="112" y="300" class="small">Conversation A</text><text x="112" y="322" class="tiny">消息、工具、Question UI</text>
  <rect x="99" y="405" width="259" height="74" rx="6" class="card"/><text x="112" y="428" class="tiny">Composer A · Model · Thinking</text><text x="112" y="454" class="small">Ask Pi…</text><rect x="321" y="440" width="24" height="24" rx="12" class="accent"/>
  <text x="397" y="236" class="label">侧边栏拥有 Session 集合和生命周期管理</text>
  <text x="397" y="270" class="small">选择 · New · Resume · Rename · Restart</text>
  <text x="397" y="294" class="small">Close Session · 配置 · 外部化</text>
  <text x="397" y="455" class="tiny">未使用 Session Tab 时，保持现有行为。</text>

  <!-- State 2 -->
  <text x="823" y="118" class="h2">2 · 外部化：侧边栏占位，Tab 承载受限会话交互</text>
  <rect x="823" y="136" width="735" height="365" rx="8" class="window"/>
  <rect x="823" y="136" width="735" height="28" rx="8" class="bar"/>
  <circle cx="842" cy="150" r="4" fill="#ff5f56"/><circle cx="856" cy="150" r="4" fill="#ffbd2e"/><circle cx="870" cy="150" r="4" fill="#27c93f"/>
  <rect x="823" y="164" width="42" height="337" class="activity"/>
  <text x="837" y="198" class="text">◆</text><text x="837" y="232" class="small">F</text>
  <rect x="865" y="164" width="292" height="337" class="sidebar"/>
  <rect x="1157" y="164" width="401" height="337" class="editor"/>
  <rect x="1157" y="164" width="108" height="31" class="tab"/><text x="1170" y="184" class="tiny">src/app.ts</text>
  <rect x="1265" y="164" width="186" height="31" class="tabActive"/><text x="1280" y="184" class="small">FrostPi · Session A  ×</text>
  <text x="884" y="195" class="tiny">FROSTPI · 控制中心仍保留</text>
  <rect x="879" y="210" width="264" height="42" rx="5" class="mutedBox"/>
  <circle cx="896" cy="231" r="5" class="green"/><text x="909" y="228" class="text">Session A</text><text x="909" y="244" class="tiny">ready · ▼ Session 列表</text>
  <rect x="880" y="276" width="262" height="160" rx="8" class="placeholder"/>
  <text x="931" y="322" class="h2">Session A</text><text x="906" y="349" class="small">当前正在编辑器 Tab 中显示</text>
  <rect x="930" y="370" width="160" height="34" rx="5" class="button"/><text x="959" y="392" class="small">转到对应 Tab</text>
  <text x="1178" y="220" class="label">Session A · 受限交互投影</text>
  <rect x="1175" y="235" width="364" height="57" rx="5" class="card"/><text x="1188" y="258" class="small">Conversation A</text><text x="1188" y="280" class="tiny">消息、工具、Question UI</text>
  <rect x="1175" y="405" width="364" height="74" rx="6" class="card"/><text x="1188" y="428" class="tiny">Composer A · Model · Thinking</text><text x="1188" y="454" class="small">Ask Pi…</text><rect x="1500" y="440" width="24" height="24" rx="12" class="accent"/>
  <text x="1190" y="329" class="limited">不包含：Session 列表 / New / Resume / Close / Restart / 设置</text>
  <text x="1190" y="356" class="small">保留：发送、Stop、Question、文件/Diff、Fork、树操作</text>

  <!-- State 3 -->
  <text x="42" y="554" class="h2">3 · 并行：侧边栏 Session B + 编辑器中的 Session A / C</text>
  <rect x="42" y="574" width="1516" height="326" rx="8" class="window"/>
  <rect x="42" y="574" width="1516" height="28" rx="8" class="bar"/>
  <rect x="42" y="602" width="42" height="298" class="activity"/>
  <rect x="84" y="602" width="310" height="298" class="sidebar"/>
  <rect x="394" y="602" width="582" height="298" class="editor"/>
  <rect x="976" y="602" width="582" height="298" class="editor" stroke="#59606b"/>
  <text x="103" y="630" class="tiny">FROSTPI · activeSessionId = Session B</text>
  <rect x="98" y="646" width="282" height="42" rx="5" class="mutedBox"/><circle cx="115" cy="667" r="5" class="green"/><text x="128" y="664" class="text">Session B</text><text x="128" y="680" class="tiny">ready · ▼ A（Tab）/ B（当前）/ C（Tab）</text>
  <rect x="99" y="709" width="280" height="55" rx="5" class="card"/><text x="112" y="733" class="small">Conversation B</text><text x="112" y="752" class="tiny">侧边栏中的完整会话</text>
  <rect x="99" y="807" width="280" height="70" rx="6" class="card"/><text x="112" y="830" class="tiny">Composer B</text><text x="112" y="855" class="small">Ask Pi…</text>
  <rect x="394" y="602" width="190" height="31" class="tabActive"/><text x="410" y="622" class="small">FrostPi · Session A  ×</text>
  <text x="417" y="667" class="label">Session A</text><rect x="414" y="685" width="542" height="66" rx="5" class="card"/><text x="429" y="711" class="small">Conversation A · running</text><text x="429" y="735" class="tiny">独立 Runtime，持续接收更新</text>
  <rect x="414" y="807" width="542" height="70" rx="6" class="card"/><text x="429" y="832" class="tiny">Composer A</text><text x="429" y="857" class="small">Steer or queue…</text>
  <rect x="976" y="602" width="190" height="31" class="tabActive"/><text x="992" y="622" class="small">FrostPi · Session C  ×</text>
  <text x="999" y="667" class="label">Session C</text><rect x="996" y="685" width="542" height="66" rx="5" class="card"/><text x="1011" y="711" class="small">Conversation C · action required</text><text x="1011" y="735" class="tiny">Question UI 位于自己的 Session Tab</text>
  <rect x="996" y="807" width="542" height="70" rx="6" class="card"/><text x="1011" y="832" class="tiny">Composer C</text><text x="1011" y="857" class="small">Ask Pi…</text>

  <!-- Rules -->
  <text x="42" y="946" class="h2">设计不变量</text>
  <rect x="42" y="965" width="360" height="52" rx="6" class="rule"/><text x="58" y="987" class="small">聚焦 Tab 不改变侧边栏选择</text><text x="58" y="1005" class="tiny">Tab 不是第二个 Session 控制中心</text>
  <rect x="422" y="965" width="360" height="52" rx="6" class="rule"/><text x="438" y="987" class="small">关闭 Tab → Session 保留</text><text x="438" y="1005" class="tiny">侧边栏恢复该 Session 的显示资格</text>
  <rect x="802" y="965" width="360" height="52" rx="6" class="rule"/><text x="818" y="987" class="small">关闭 Session → Tab 自动关闭</text><text x="818" y="1005" class="tiny">实体消失时，其投影必须消失</text>
  <rect x="1182" y="965" width="376" height="52" rx="6" class="rule"/><text x="1198" y="987" class="small">同一 Session 最多一个 Tab</text><text x="1198" y="1005" class="tiny">重复打开只 reveal 已有投影</text>
</svg>
